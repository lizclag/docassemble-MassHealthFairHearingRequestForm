question: |
  Do you have any documents to upload in support of ${ person_possessive } appeal?
subquestion: |
  You have uploaded ${ x.number_gathered() } document(s) so far as Proof of Legal Authority of ${ users[0] }. You can upload multiple documents. 
  
  % if hasattr(x, 'maximum_size'):
  The total size of all exhibits must be less than ${ humanize.naturalsize(x.maximum_size) }.
  You can upload ${ humanize.naturalsize(x.maximum_size - x.size_in_bytes())} more.
  % endif

  ${ collapse_template(x.in_progress_exhibits) }
field: x.there_is_another
buttons:
  - Finished adding documents: False
  - Add another document: True
help: |  
     % if is_eligibility_appeal:
      **Tip:** If MassHealth says you are not eligible because they are missing a document (for example, proof of income, incarceration status, or immigration status), you can upload that document here.

      If you upload the missing document and choose **Pre-hearing Resolution**, MassHealth may be able to fix the problem without a hearing.
  
      % else:
      An example of a supporting document is a letter from a medical professional or doctor to support the reason of medical necessity.
      <div class="alert alert-info" role="alert">
        <strong>Tip:</strong> If you do not have these documents ready now, you can still complete and file this form. You can send documents to the hearing office later, as long as they are submitted before your hearing. <strong>Email: BOH-FairHearingsubmissions@MassMail.State.MA.US</strong>
      </div>
      % endif 
---
generic object: ALExhibitList
id: any exhibits
if: |
  al_person_answering == "user"
question: |
  Do you have any documents to attach to this form? 
fields:
  - "Do you have any documents you want to upload?": x.has_exhibits
    datatype: yesnoradio
  - note: |
     % if is_eligibility_appeal:
      **Tip:** If MassHealth says you are not eligible because they are missing a document (for example, proof of income, incarceration status, or immigration status), you can upload that document here.

