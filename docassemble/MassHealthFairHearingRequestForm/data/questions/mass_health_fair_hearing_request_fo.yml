question: |
  % if al_person_answering == "user":
   Do you need need an assistive device or any accommodations for your hearing?
  % else:
  Does ${ users[0] } need an assistive device or any accomodations for their hearing?
  % endif
subquestion: |
  Check all that apply.
fields:
  - "An assistive device is needed to communicate at the hearing": needs_assistive_device
    datatype: yesno

  - "Type of assistive device needed": assistive_device_type
    datatype: dropdown
    choices:
      - Wireless FM assisted listening device
      - Neck loop for T-coil hearing aid
      - Pocketalker amplifier
      - CART (real-time captioning)
      - Other: other
    show if: needs_assistive_device
    required: True

  - "Describe the assistive device needed": assistive_device_type_other
    datatype: area
    rows: 1
    show if:
      variable: assistive_device_type
      is: other
    required: True

  - "Another accommodation for a disability is needed": needs_other_accommodation
    datatype: yesno

  - "Describe the other accommodation needed": other_accommodation_type
    datatype: area
    rows: 1
    show if: needs_other_accommodation
    required: True

---
id: appeal representative gate
question: |
  % if al_person_answering == "user":
  Do you have an appeal representative?
  % else:
  Does ${ users[0] } have an appeal representative?
  % endif
subquestion: |
  Is a lawyer or other representative helping with the appeal?
fields:
  - "": has_appeal_representative
    datatype: yesnoradio

  - note: |
      <div class="alert alert-secondary" role="alert">
      <strong>Tip:</strong> If a lawyer or representative is working with you, you may want to talk with them about this form before you submit it.
      </div> 
show if: has_appeal_representative
---
id: appeal representative details
question: |
  Appeal representative information
subquestion: |
  Please provide ${ person_possessive_or_your } appeal representative’s contact information.
fields:
  - "Full name": representative_name_full
    maxlength: 38
  - "Phone number": representative_phone_number
    datatype: text
    maxlength: 17
  - "Mailing address": representative_address_address
    maxlength: 79
  - "City": representative_address_city
    maxlength: 33
  - "State": representative_address_state
    maxlength: 5
  - "ZIP code": representative_address_zip
    maxlength: 14
depends on:
  - has_appeal_representative
---
code: |
  signature_fields = ['users[0].signature']
---
id: preview mass_health_fair_hearing_request_fo
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.   
  
  ${ al_recipient_bundle.as_pdf(key='preview') }

  Click the image to open it in a new tab. Click the "Edit answers" button
  to edit your answers.

  ${ action_button_html(url_action('review_mass_health_fair_hearing_request_fo'), label='Edit answers', color='info') }
  
  Remember to come back to this window to continue and sign your form.
continue button field: mass_health_fair_hearing_request_fo_preview_question    
---
id: mass health fair hearing request fo review screen
event: review_mass_health_fair_hearing_request_fo
question: |
  Review your answers
review:
  - Edit: al_person_answering
    button: |
      **Who is filling out this form?**:
      % if al_person_answering == "user":
      Myself
      % else:
      Someone else
      % endif

  - Edit: filler.name.first
    show if: al_person_answering != "user"
    button: |
      **Person filling out this form**:
      ${ filler }

  - Edit: user_guardian
    show if: al_person_answering != "user"
    button: |
      **The person filling out this form is the parent or legal guardian**:
      ${ word(yesno(user_guardian)) }

  - Edit: filler_member_id
    show if: al_person_answering != "user" and user_guardian
    button: |
      **filler Member ID Number**:
      ${ filler_member_id }

  - Edit: users.revisit
    button: |
      **Users**

      % for item in users:
        * ${ item }
      % endfor

  - Edit: user_member_id
    button: |
      **Member ID Number**:
      ${ user_member_id }

  - Edit: appeal_reason_income
    button: |
      **income**:
      ${ word(yesno(appeal_reason_income)) }

  - Edit: appeal_reason_immigration
    button: |
      **immigration**:
      ${ word(yesno(appeal_reason_immigration)) }

  - Edit: appeal_reason_family_size
    button: |
      **family size**:
      ${ word(yesno(appeal_reason_family_size)) }

  - Edit: appeal_reason_other_insurance
    button: |
      **access to other insurance**:
      ${ word(yesno(appeal_reason_other_insurance)) }

  - Edit: appeal_reason_residency
    button: |
      **residency**:
      ${ word(yesno(appeal_reason_residency)) }

  - Edit: appeal_reason_incarceration
    button: |
      **incarceration status**:
      ${ word(yesno(appeal_reason_incarceration)) }

  - Edit: appeal_reason_other
    button: |
      **other**:
      ${ word(yesno(appeal_reason_other)) }

  - Edit: is_eligibility_appeal
    button: |
      **This appeal is about eligibility**:
      ${ word(yesno(is_eligibility_appeal)) }

  - Edit: appeal_reason_explanation
    button: |
      **Why are you asking for a review? You can attach any documents that helps explain why.**:

      ${ appeal_reason_explanation }

  - Edit: exhibit_attachment.exhibits.has_exhibits
    button: |
      **I uploaded documents to support my appeal**:
      ${ word(yesno(exhibit_attachment.exhibits.has_exhibits)) }

  - Edit: appeal_keep_benefits_request
    button: |
      **Keep my benefits the same during my appeal. If I choose this option and lose my appeal, I may have to pay back the cost of the benefits I received during that time.**:
      ${ word(yesno(appeal_keep_benefits_request)) }

  - Edit: appeal_accept_change
    button: |
      **Accept the change to my benefits during my appeal. If I choose this option and win my appeal, MassHealth will return my benefits to the original amount.**:
      ${ word(yesno(appeal_accept_change)) }

  - Edit: appeal_request_phr
    show if: is_eligibility_appeal
    button: |
      **I choose Prehearing Resolution (PHR) *This option is only for eligibility decisions. PHR lets you try to fix the issue before having a formal hearing. If you choose PHR, MassHealth will contact you to help resolve the problem. In some cases, the Board of Hearings may schedule a hearing before MassHealth contacts you. You can use PHR to fix eligibility issues like wrong contact information, missing documents, renewal problems, income verification questions, or an eligibility decision.**:
      ${ word(yesno(appeal_request_phr)) }

  - Edit: hearing_type
    button: |
      **Type of hearing**:
      % if hearing_type == "in_person":
      In person
      % elif hearing_type == "phone":
      By phone
      % elif hearing_type == "video":
      By video
      % endif

  - Edit: inperson_location
    show if: hearing_type == "in_person"
    button: |
      **Hearing location preference**:
      ${ inperson_location }

  - Edit: hearing_phone_number
    show if: hearing_type == "phone"
    button: |
      **Phone number for hearing**:
      ${ hearing_phone_number }

  - Edit: hearing_email
    show if: hearing_type == "video"
    button: |
      **Email for video hearing**:
      ${ hearing_email }

  - Edit: user_needs_interpreter
    button: |
      **User needs interpreter**:
      ${ word(yesno(user_needs_interpreter)) }

  - Edit: user_preferred_language
    show if: user_needs_interpreter
    button: |
      **User preferred language**:
      ${ user_preferred_language }

  - Edit: needs_assistive_device
    button: |
      **I need an assistive device to communicate at a hearing**:
      ${ word(yesno(needs_assistive_device)) }

  - Edit: assistive_device_type
    show if: needs_assistive_device
    button: |
      **The type of device I need is**:
      % if assistive_device_type == "other":
      ${ assistive_device_type_other }
      % else:
      ${ assistive_device_type }
      % endif

  - Edit: needs_other_accommodation
    button: |
      **I need another accommodation for a disability**:
      ${ word(yesno(needs_other_accommodation)) }

  - Edit: other_accommodation_type
    show if: needs_other_accommodation
    button: |
      **The type of accommodation I need is**:
      ${ other_accommodation_type }

  - Edit: has_appeal_representative
    button: |
      **I have someone helping me with my appeal**:
      ${ word(yesno(has_appeal_representative)) }

  - Edit: representative_name_full
    show if: has_appeal_representative
    button: |
      **Do you have someone helping you with your appeal? If yes, please provide their full name.**:
      ${ representative_name_full }

  - Edit: representative_phone_number
    show if: has_appeal_representative
    button: |
      **Do you have someone helping you with your appeal? If yes, please provide their phone number.**:
      ${ representative_phone_number }

  - Edit: representative_address_address
    show if: has_appeal_representative
    button: |
      **Mailing Address**:
      ${ representative_address_address }

  - Edit: representative_address_city
    show if: has_appeal_representative
    button: |
      **City**:
      ${ representative_address_city }

  - Edit: representative_address_state
    show if: has_appeal_representative
    button: |
      **State**:
      ${ representative_address_state }

  - Edit: representative_address_zip
    show if: has_appeal_representative
    button: |
      **Zip**:
      ${ representative_address_zip }

  - Edit: has_legal_authority
    show if: has_appeal_representative
    button: |
      **I uploaded proof that this person can act as the appeal representative**:
      ${ word(yesno(has_legal_authority)) }

  - Edit: signature_date
    button: |
      **Date of signature**:
      ${ signature_date }

  - Edit: users[0].signature
    show if: al_person_answering == "user" or not user_guardian
    button: |
      **signature**:
      ${ users[0].signature }

  - Edit: filler.signature
    show if: al_person_answering != "user" and user_guardian
    button: |
      **signature**:
      ${ filler.signature }
---
continue button field: users.revisit
question: |
  Edit users
subquestion: |
  ${ users.table }

  ${ users.add_action() }
---
table: users.table
rows: users
columns:
  - Name: |
      row_item.name.full() if defined("row_item.name.first") else ""
  - Address: |
      row_item.address.block() if defined("row_item.address.zip") else ""
  - Phone number: |
      row_item.phone_number if defined("row_item.phone_number") else ""
  - Birthdate: |
      row_item.birthdate if defined("row_item.birthdate") else ""
edit:
  - name.first
  - address.zip
  - phone_number
  - birthdate
confirm: True

---
id: download mass_health_fair_hearing_request_fo
event: mass_health_fair_hearing_request_fo_download
question: |
  All done
subquestion: |
  Thank you ${users}. Your form is ready to download and deliver.
  
  View, download and send your form below. Click the "Edit answers" button to fix any mistakes.

  ${ action_button_html(url_action('review_mass_health_fair_hearing_request_fo'), label='Edit answers', color='info') }
  
  
  ${ al_user_bundle.download_list_html() }
  

  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }

progress: 100
---
# ALDocument objects specify the metadata for each template
objects:
  - mass_health_fair_hearing_request_fo_Post_interview_instructions: ALDocument.using(title="Instructions", filename="mass_health_fair_hearing_request_fo_next_steps.docx", enabled=True, has_addendum=False)
  - mass_health_fair_hearing_request_fo_attachment: ALDocument.using(title="Mass Health Fair Hearing Request Form", filename="mass_health_fair_hearing_request_fo", enabled=True, has_addendum=False, )
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[mass_health_fair_hearing_request_fo_Post_interview_instructions, mass_health_fair_hearing_request_fo_attachment,exhibit_attachment], filename="mass_health_fair_hearing_request_fo", title="All forms to download for your records", enabled=True)
  - al_recipient_bundle: ALDocumentBundle.using(elements=[mass_health_fair_hearing_request_fo_attachment,exhibit_attachment],  filename="mass_health_fair_hearing_request_fo", title="All forms to file", enabled=True)
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the same template is 
# used for "preview" and "final" keys, and logic in the template checks the value of 
# `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: mass_health_fair_hearing_request_fo_next_steps
  docx template file: mass_health_fair_hearing_request_fo_next_steps.docx
  variable name: mass_health_fair_hearing_request_fo_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: mass health fair hearing request fo
  filename: mass_health_fair_hearing_request_fo
  variable name: mass_health_fair_hearing_request_fo_attachment[i]
  skip undefined: True
  pdf template file: mass_health_fair_hearing_request_fo.pdf
  editable: true
  fields:
      - "user_name_first": ${ users[0].name.first }
      - "user_name_last": ${ users[0].name.last }
      - "user_name_middle_initial": ${ users[0].name.middle_initial() }
      - "user_address_address": ${ users[0].address.address }
      - "user_address_city": ${ users[0].address.city }
      - "user_address_state": ${ users[0].address.state }
      - "user_address_zip": ${ users[0].address.zip }
      - "user_phone_number": ${ users[0].phone_number }
      - "user_member_id": ${ user_member_id }
      - "filler_member_id": |
          % if al_person_answering != "user" and user_guardian and filler_member_id:
          (ID: ${ filler_member_id })
          % endif
      - "user_birthdate": ${ users[0].birthdate.format("MM/dd/yyyy") }
      - "appeal_reason_income": ${ appeal_reason_income }
      - "appeal_reason_immigration": ${ appeal_reason_immigration }
      - "appeal_reason_family_size": ${ appeal_reason_family_size }
      - "appeal_reason_other_insurance": ${ appeal_reason_other_insurance }
      - "appeal_reason_residency": ${ appeal_reason_residency }
      - "appeal_reason_incarceration": ${ appeal_reason_incarceration }
      - "appeal_reason_other": ${ appeal_reason_other }
      - "appeal_reason_other_explanation": |
          % if appeal_reason_other:
            % if appeal_reason_other_type == "medical_necessity": 
            Medical Necessity
            % else:
            ${ appeal_reason_other_text }
            % endif
          % endif
      - "appeal_reason_explanation": ${ appeal_reason_explanation }
      - "appeal_keep_benefits_request": ${ appeal_keep_benefits_request }
      - "appeal_accept_change": ${ appeal_accept_change }
      - "appeal_request_phr": ${ appeal_request_phr }
      - "hearing_in_person": ${ hearing_in_person }
      - "inperson_location": ${ "My preferred hearing location is " + inperson_location + ", MA" if hearing_in_person and inperson_location != "No location preference" else '' }
      - "hearing_by_phone": ${ hearing_by_phone }
      - "hearing_phone_number": ${ hearing_phone_number }
      - "hearing_by_video": ${ hearing_by_video }
      - "hearing_email": ${ hearing_email }
      - "user_needs_interpreter": ${ user_needs_interpreter }
      - "user_preferred_language": ${ user_preferred_language }
      - "needs_assistive_device": ${ needs_assistive_device }
             
      - "assistive_device_type": |
            % if assistive_device_type == "other":
            ${ assistive_device_type_other }
            % else: 
            ${ assistive_device_type }
            % endif
      - "needs_other_accommodation": ${ needs_other_accommodation }
      - "other_accommodation_type": ${ other_accommodation_type }
      - "representative_name_full": ${ representative_name_full }
      - "representative_phone_number": ${ representative_phone_number }
      - "representative_address_address": ${ representative_address_address }
      - "representative_address_city": ${ representative_address_city }
      - "representative_address_state": ${ representative_address_state }
      - "representative_address_zip": ${ representative_address_zip }
      - "user_signature": |
          % if al_person_answering == "user":
          ${ users[0].signature }
          % else:
            % if user_guardian:
            ${ filler.signature }
            % else:
            ${ users[0].signature }
            % endif
          % endif
      - "signature_date": ${ signature_date }
      - "user_name_full": |
          % if al_person_answering == "user":
          ${ users[0] }
          % else:
            % if user_guardian:
            ${ filler }
            % else:
            ${ users[0] }
            % endif
          % endif
---