      <div class="alert alert-secondary" role="alert">
      <strong>Tip:</strong> You may upload any documentation demonstrating your legal authority to act on ${ users[0] }'s behalf, such as a power of attorney, court appointment, guardianship order, or letters of authority.
       </div> 
  - Document title: exhibit_attachment.exhibits[0].title
    default: Proof of Legal Guardianship or Power of Attorney
    maxlength: 60
  - Upload the document: exhibit_attachment.exhibits[0].pages
    datatype: files
    maximum image size: 1024
    image upload type: jpeg
    accept: |
      'image/png, image/jpeg, .doc, .docx, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/pdf, .pdf'
---
id: user address
question: |
  What is ${ person_possessive_or_your } address?
fields:
  - Street address: users[0].address.address
  - Apartment, suite, or unit (optional): users[0].address.unit
    required: False
  - City: users[0].address.city
  - State: users[0].address.state
  - ZIP code: users[0].address.zip

---
id: user phone number
question: |
  % if al_person_answering == "user":
  What is your phone number?
  % else:
  What is ${ users[0] }'s phone number?
  % endif
fields:
  - Phone number: users[0].phone_number
    datatype: al_international_phone
---
id: What is users MassHealth Member ID number
question: |
  %if al_person_answering== "user":
  If you have a MassHealth Member ID number please enter it below
  %else:
  If ${ users[0] } has a MassHealth Member ID number please enter it below
  %endif
subquestion: |
  You can find ${ person_possessive_or_your } Member ID on their MassHealth card or on letters addressed to them from MassHealth.
  If you cannot find it, you can call MassHealth for help at  (800) 841-2900 or check their online MassHealth account (MAP) [Login to MassHealth account (MAP)](https://login.mahix.org/oneapp/index.html#/login).
fields:
  - "Member ID Number": user_member_id
    maxlength: 12
    required: false
---
id: user birthdate
question: |
  What is ${ person_possessive_or_your } date of birth?
fields:
  - Date of birth: users[0].birthdate
    datatype: date
---
id: appeal reasons checklist
question: |
  % if al_person_answering == "user":
  Why are you appealing?
  % else:
  Why is ${ users[0] } appealing?
  % endif
subquestion: |
  Check any reasons that apply
fields:
  - "income": appeal_reason_income
    datatype: yesno
  - "immigration": appeal_reason_immigration
    datatype: yesno
  - "family size": appeal_reason_family_size
    datatype: yesno
  - "access to other insurance": appeal_reason_other_insurance
    datatype: yesno
  - "residency": appeal_reason_residency
    datatype: yesno
  - "incarceration status": appeal_reason_incarceration
    datatype: yesno
  - "other": appeal_reason_other
    datatype: yesno

  - "Please choose other reason": appeal_reason_other_type
    datatype: radio
    choices:
      - Medical necessity: medical_necessity
      - Something else: something_else
    show if: appeal_reason_other
    required: True

  - "Please describe": appeal_reason_other_text
    datatype: area
    rows: 1
    show if:
      variable: appeal_reason_other_type
      is: something_else
    required: True
---
id: eligibility appeal gate
question: |
  Is this appeal about ${ person_possessive_or_your } MassHealth eligibility?
fields:
  - no label: is_eligibility_appeal
    datatype: yesnoradio
---
id: prehearing resolution option
question: |
  Prehearing Resolution (PHR)
subquestion: |
  PHR is an option for eligibility appeals only. It lets ${ person_name_or_you } try to fix the issue before a formal hearing.

  If you choose PHR, MassHealth will contact ${ person_name_or_you }. In some cases, the Board of Hearings may schedule the hearing before MassHealth contacts ${ person_name_or_you }.

  Some examples of eligibility issues that can be resolved through PHR are inaccurate contact information, missing documents, renewal problems, or income verification information.
fields:
  - "I choose Prehearing Resolution (PHR).": appeal_request_phr
    datatype: yesno
    required: False
---
id: appeal explanation and upload
question: |
  % if al_person_answering == "user":
  Why are you appealing this MassHealth decision?
  % else:
  Why is ${ users[0] } appealing this MassHealth decision?
  % endif 
   
fields:
  - "Please explain in a few sentences" : appeal_reason_explanation
    datatype: area

help: |  
      % if is_eligibility_appeal:
      **Example (eligibility appeal):**  
      “I am eligible for MassHealth. I sent the documents to MassHealth to prove this. I sent [document name] on [date] and [tell MassHealth the ways you tried to get them this information (i.e. signed releases, the people I spoke with over the phone told me what to send and I sent it by mail, delivered in person, email, fax, etc.)] Please review my eligibility and the information I provided.”
      
      <div class="alert alert-secondary" role="alert">
      <strong>Tip:</strong> If MassHealth says you are not eligible because they are missing proof of something (for example: income, incarceration status, or immigration status), and you have that document, you can upload it on the next screen.
      </div> 
      % else:
      **Example (medical necessity appeal):**  
      “MassHealth denied [service/equipment/treatment], but I need it for my  health. My [doctor/therapist/social worker] says it is medically necessary. Their name is [name], they work at [clinic/hospital], and their phone number is [phone]. This service helps me because [1–2 sentences about symptoms/limits and what the service will do].”
      
       <div class="alert alert-secondary" role="alert">
      <strong>Tip:</strong> If MassHealth says you are no longer covered because they are missing proof of something (for example: a letter from your provider, income, incarceration status, or immigration status), and you have that document, you can upload it on the next screen.
      </div> 
      % endif
---
generic object: ALExhibitList
