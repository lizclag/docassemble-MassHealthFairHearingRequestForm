  % endif
subquestion: |
  *Choose one option below*
  
  **Important Note:**
  
  - If you choose **"Keep my benefits the same during my appeal"** and lose the appeal, you may have to pay back the cost of the benefits received during the appeal.
  
  - If you choose **"Accept the change to my benefits during my appeal"** and win the appeal, MassHealth will return your benefits to the original amount going forward.

fields:
  - no label: appeal_benefits_choice
    datatype: radio
    choices:
      - Keep my benefits the same during my appeal.: keep
      - Accept the change to my benefits during my appeal.: accept
   
---
