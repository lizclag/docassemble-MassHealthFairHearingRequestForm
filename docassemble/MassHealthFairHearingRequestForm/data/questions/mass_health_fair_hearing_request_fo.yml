---
id: Mass_Health_Fair_Hearing_Request_Form
continue button field: mass_health_fair_hearing_request_fo_intro
question: |
  MassHealth Fair Hearing Request
subquestion: |
  This interview will guide you through completing a request for a MassHealth Fair Hearing.

  **Before you begin, you should have:**

  1. The MassHealth Member ID number (if you or the person you are filing for has one).
  
  2. The notice from MassHealth about the decision you are appealing.
  
  3. Any documents that support your appeal (if readily available).

  <div class="alert alert-info" role="alert">
  <strong>Tip:</strong> You do not need to have every document you wish to submit before starting. You can submit documents to the hearing office after you file this form by emailing them to: <br><br> <strong> <u>BOH-FairHearingsubmissions@MassMail.State.MA.US.</u> </strong> </div>

  **After you finish, you will need to:**

  1. Save or print a copy of your completed form for your records.
  
  2. Attach a copy of the MassHealth notice you are appealing.
  
  3. Submit your request as soon as possible to the Office of Medicaid, Board of Hearings. You must submit it within 60 days of receiving the notice.

  Most people take about 10 minutes to complete this interview.
---
id: who_is_answering
question: |
  Are you filling this form out for yourself, or for someone else?
fields:
  - I am filling this out for: al_person_answering
    datatype: radio
    choices:
      - Myself: user
      - Someone else: filler
---
id: filler_name
question: |
  What is your name?
fields:
  - First name: filler.name.first
  - Middle (optional): filler.name.middle
    required: False
  - Last name: filler.name.last

---
id: filler_Mass Health Number
question: |
  If you have one, what is your MassHealth Member ID number?
subquestion: |
  You can find your Member ID on your MassHealth card or on letters from MassHealth.
  If you cannot find it, you can call MassHealth for help at  (800) 841-2900 or check the online MassHealth account (MAP) [Login to MassHealth account (MAP)](https://login.mahix.org/oneapp/index.html#/login).
fields:
  - "Member ID Number": filler_member_id
    maxlength: 12
    required: False
---
id: user name
question: |
  % if al_person_answering == "user":
  What is your full legal name?
  % else:
  Who is this form for?
  % endif
subquestion: |
  % if al_person_answering == "user":
  Enter your full legal name as it appears on MassHealth records.
  % else:
  Enter their full legal name as it appears on MassHealth records.
  % endif
fields:
  - First name: users[0].name.first
  - Middle (optional): users[0].name.middle
    required: False
  - Last name: users[0].name.last

---
code: |
  person_name = str(users[0])
  person_possessive = f"{person_name}'s"
  if al_person_answering == "user":
    person_name_or_you = "you"
    person_possessive_or_your = "your"
  else:
    person_name_or_you = person_name
    person_possessive_or_your = person_possessive
---
id: filler is user guardian
question: |
  Are you the parent or legal guardian of the person you are filling this form out for?
fields:
  - no label: user_guardian
    datatype: yesnoradio

---
id: legal decision making documents
if: |
  al_person_answering != "user"
question: |
   Are you legally able to make decisions for ${ users[0] }? 
subquestion: |
  If you are the legal guardian of ${ users[0] } or have power of attorney, please upload the legal document that allows you to submit this appeal on ${ users[0] }'s behalf.
fields:
  - "": has_legal_authority
    datatype: yesnoradio
---
id: legal authority upload
