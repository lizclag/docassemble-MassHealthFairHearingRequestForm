[build-system]
requires = [
    "setuptools>=80.9.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "docassemble.MassHealthFairHearingRequestForm"
version = "1.0"
description = "A Docassemble Interview for a Mass Health Fair Hearing Request Form"
readme = "README.md"
authors = [
    { name = "Elisabeth Clagett", email = "elisabeth.clagett@su.suffolk.edu" },
]
dependencies = [
    "docassemble.ALMassachusetts @ git+https://github.com/suffolklitlab/docassemble-ALMassachusetts.git@main",
    "docassemble.AssemblyLine @ git+https://github.com/SuffolkLITLab/docassemble-AssemblyLine.git@main",
]

[project.urls]
Homepage = "https://courtformsonline.org"

[tool.setuptools.packages.find]
where = [
    ".",
]
